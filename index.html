<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 위치 날씨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>내 위치 날씨</h1>
      <p class="subtitle">위치 권한을 허용하면 현재 위치의 날씨를 보여줍니다.</p>
    </header>

    <section id="prompt" class="card">
      <p>브라우저의 위치 정보를 사용해 날씨를 조회합니다.</p>
      <button id="locate-btn" type="button">내 위치 날씨 보기</button>
    </section>

    <section id="status" class="card hidden" role="status" aria-live="polite"></section>

    <section id="weather" class="hidden">
      <div class="card current">
        <div class="location" id="location"></div>
        <div class="current-main">
          <span class="icon" id="current-icon"></span>
          <span class="temp" id="current-temp"></span>
        </div>
        <div class="desc" id="current-desc"></div>
        <dl class="details">
          <div><dt>체감</dt><dd id="feels-like"></dd></div>
          <div><dt>습도</dt><dd id="humidity"></dd></div>
          <div><dt>바람</dt><dd id="wind"></dd></div>
          <div><dt>강수</dt><dd id="precip"></dd></div>
        </dl>
        <div class="updated" id="updated"></div>
      </div>

      <h2>7일 예보</h2>
      <ul class="daily" id="daily"></ul>

      <button id="refresh-btn" type="button" class="secondary">새로고침</button>
    </section>

    <footer>
      날씨 데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
